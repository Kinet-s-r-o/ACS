server_tokens off;


# ------------------------------------------------------------
# Web UI + Management API
# ------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'" always;


    # SPA: always revalidate index.html so the browser picks up new bundle refs.
    # The browser normally enters the application through "/", so cover that
    # URL explicitly as well. Otherwise a cached HTML shell can reference
    # bundles from a previous deployment and leave the SPA blank until F5.
    location = / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'" always;
    }

    # Vite hashed assets are content-addressed; safe to cache indefinitely.
    location /assets/ {
        add_header Cache-Control "max-age=31536000, immutable" always;
    }


    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }


    location = /api {
        return 308 /api/;
    }


    location /api/ {
        proxy_pass http://skyacs:7548/;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # TLS is terminated by Coolify / Traefik.
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Firmware URLs can contain signed credentials.
        access_log off;
    }


    location / {
        try_files $uri $uri/ /index.html;
    }
}


# ------------------------------------------------------------
# CWMP / TR-069 reverse proxy
#
# TLS is terminated by Coolify / Traefik.
# Backend port 7547 is never exposed directly.
# ------------------------------------------------------------
server {
    listen 7547;
    server_name _;

    client_max_body_size 16m;

    location / {
        proxy_pass http://skyacs:7547;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Required because actual TLS termination happens in Traefik.
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
