services:

  acs-postgres:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    command: postgres -c shared_preload_libraries=timescaledb,pg_stat_statements

    environment:
      POSTGRES_DB: acs
      POSTGRES_USER: acs
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    volumes:
      - acs-postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U acs -d acs
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - backend


  acs:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend

    restart: unless-stopped

    environment:
      TZ: ${TZ:-Europe/Bratislava}

      PORT: "7547"
      API_PORT: "7548"

      CWMP_BIND_ADDR: 0.0.0.0
      API_BIND_ADDR: 0.0.0.0

      DB_HOST: acs-postgres
      DB_PORT: "5432"
      DB_NAME: acs
      DB_USER: acs
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSLMODE: disable
      DB_MAX_OPEN_CONNS: "50"
      DB_MAX_IDLE_CONNS: "10"

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PARAMETER_ENCRYPTION_KEY: ${PARAMETER_ENCRYPTION_KEY:?PARAMETER_ENCRYPTION_KEY is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}

      CORS_ALLOWED_ORIGINS: https://${ACS_DOMAIN:?ACS_DOMAIN is required}
      ADMIN_WEB_ALLOWED_CIDRS: ${ADMIN_WEB_ALLOWED_CIDRS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      CWMP_TRUSTED_PROXY_CIDRS: ${CWMP_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}

      CWMP_USERNAME: ${CWMP_USERNAME:-}
      CWMP_PASSWORD: ${CWMP_PASSWORD:-}
      CWMP_ALLOWED_CIDRS: ${CWMP_ALLOWED_CIDRS:-}
      CONNECTION_REQUEST_ALLOWED_CIDRS: ${CONNECTION_REQUEST_ALLOWED_CIDRS:-}

      FIRMWARE_UPLOAD_DIR: /var/lib/acs/firmware
      TEMPLATE_IMAGE_UPLOAD_DIR: /var/lib/acs/template-images
      ALLOW_INSECURE_FIRMWARE_URL: "false"

    volumes:
      - acs-firmware:/var/lib/acs/firmware
      - acs-template-images:/var/lib/acs/template-images

    expose:
      - "7547"
      - "7548"

    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:7548/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    depends_on:
      acs-postgres:
        condition: service_healthy

    networks:
      - backend


  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-ACS}

    restart: unless-stopped

    expose:
      - "8080"
      - "7547"

    depends_on:
      acs:
        condition: service_healthy

    networks:
      - backend
      - proxy

    labels:
      traefik.enable: "true"
      traefik.docker.network: acs-proxy

      traefik.http.routers.acs-web.rule: Host(`${ACS_DOMAIN:?ACS_DOMAIN is required}`)
      traefik.http.routers.acs-web.entrypoints: websecure
      traefik.http.routers.acs-web.tls: "true"
      traefik.http.routers.acs-web.tls.certresolver: letsencrypt
      traefik.http.routers.acs-web.service: acs-web
      traefik.http.services.acs-web.loadbalancer.server.port: "8080"

      traefik.http.routers.acs-cwmp.rule: Host(`${CWMP_DOMAIN:?CWMP_DOMAIN is required}`)
      traefik.http.routers.acs-cwmp.entrypoints: websecure
      traefik.http.routers.acs-cwmp.tls: "true"
      traefik.http.routers.acs-cwmp.tls.certresolver: letsencrypt
      traefik.http.routers.acs-cwmp.service: acs-cwmp
      traefik.http.services.acs-cwmp.loadbalancer.server.port: "7547"


  traefik:
    image: traefik:v3.5
    restart: unless-stopped

    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=acs-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL is required}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acs-traefik-letsencrypt:/letsencrypt

    depends_on:
      web:
        condition: service_started

    networks:
      - proxy


volumes:
  acs-postgres:
  acs-firmware:
  acs-template-images:
  acs-traefik-letsencrypt:


networks:
  backend:
    driver: bridge
  proxy:
    name: acs-proxy
    driver: bridge
