services:

  skyacs-postgres:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    command: postgres -c shared_preload_libraries=timescaledb

    environment:
      POSTGRES_DB: skyacs
      POSTGRES_USER: skyacs
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    volumes:
      - skyacs-postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U skyacs -d skyacs
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - backend


  skyacs:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend

    restart: unless-stopped

    environment:
      TZ: Europe/Bratislava

      PORT: "7547"
      API_PORT: "7548"

      CWMP_BIND_ADDR: 0.0.0.0
      API_BIND_ADDR: 0.0.0.0

      DB_HOST: skyacs-postgres
      DB_PORT: "5432"
      DB_NAME: skyacs
      DB_USER: skyacs
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      # PostgreSQL runs inside the private Docker network.
      DB_SSLMODE: disable

      DB_MAX_OPEN_CONNS: "50"
      DB_MAX_IDLE_CONNS: "10"

      JWT_SECRET: ${JWT_SECRET}
      PARAMETER_ENCRYPTION_KEY: ${PARAMETER_ENCRYPTION_KEY}

      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}

      CORS_ALLOWED_ORIGINS: ${ACS_PUBLIC_URL:-${SKYACS_PUBLIC_URL:?Set ACS_PUBLIC_URL}}

      # The backend is reachable only through the internal
      # nginx container. Docker bridge networks normally use this range.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      CWMP_TRUSTED_PROXY_CIDRS: ${CWMP_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}

      CWMP_USERNAME: ${CWMP_USERNAME:-}
      CWMP_PASSWORD: ${CWMP_PASSWORD:-}

      CWMP_ALLOWED_CIDRS: ${CWMP_ALLOWED_CIDRS:-}

      CONNECTION_REQUEST_ALLOWED_CIDRS: ${CONNECTION_REQUEST_ALLOWED_CIDRS:-}

      FIRMWARE_UPLOAD_DIR: /var/lib/skyacs/firmware
      TEMPLATE_IMAGE_UPLOAD_DIR: /var/lib/skyacs/template-images
      ALLOW_INSECURE_FIRMWARE_URL: "false"

    volumes:
      - skyacs-firmware:/var/lib/skyacs/firmware
      - skyacs-template-images:/var/lib/skyacs/template-images

    expose:
      - "7547"
      - "7548"

    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:7548/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    depends_on:
      skyacs-postgres:
        condition: service_healthy

    networks:
      - backend


  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web

    restart: unless-stopped

    expose:
      - "8080"
      - "7547"

    depends_on:
      skyacs:
        condition: service_healthy

    networks:
      - backend
      - coolify


volumes:

  skyacs-postgres:

  skyacs-firmware:

  skyacs-template-images:


networks:

  backend:
    driver: bridge

  coolify:
    external: true
